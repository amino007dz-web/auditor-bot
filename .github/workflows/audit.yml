name: Smart Contract Audit

on:
  pull_request:
    paths:
      - '**.sol'
      - '**.vy'
      - '**.move'
  push:
    branches: [main, master]
    paths:
      - '**.sol'
      - '**.vy'
      - '**.move'
  workflow_dispatch:
    inputs:
      contract_path:
        description: 'Path to contract file(s)'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Solidity files
        id: find
        run: |
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} HEAD -- '*.sol' '*.vy' '*.move' 2>/dev/null || echo "")
          if [ -z "$files" ]; then
            files=$(find . -name "*.sol" -o -name "*.vy" -o -name "*.move" | head -5)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Audit
        id: audit
        if: steps.find.outputs.files != ''
        env:
          AUDITOR_API_URL: ${{ secrets.AUDITOR_API_URL || 'https://auditor-bot.onrender.com' }}
          AUDITOR_API_KEY: ${{ secrets.AUDITOR_API_KEY }}
        run: |
          echo "Auditing contracts..."
          for file in ${{ steps.find.outputs.files }}; do
            if [ -f "$file" ]; then
              code=$(cat "$file")
              result=$(curl -s -X POST "$AUDITOR_API_URL/api/analyze/json" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $AUDITOR_API_KEY" \
                -d "{\"code\": $(echo "$code" | head -c 4000 | jq -Rs .), \"type\": \"audit\"}")
              echo "## $file" >> audit-report.md
              echo "$result" | jq -r '.report // .result // .error // "Unknown"' >> audit-report.md
              echo "" >> audit-report.md
            fi
          done

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.md', 'utf8');
            if (report.trim()) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🛡️ Smart Contract Audit Report\n\n' + report.slice(0, 60000)
              });
            }
