name: Smart Contract Audit

on:
  pull_request:
    paths:
      - "**.sol"
      - "**.vy"
      - "**.move"
      - "**.clsp"
  push:
    branches: [master]
    paths:
      - "**.sol"
      - "**.vy"
      - "**.move"
      - "**.clsp"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find changed Solidity files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.sol
            **/*.vy
            **/*.move
            **/*.clsp

      - name: Run audit on changed files
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          mkdir -p reports
          for file in ${{ steps.changed.outputs.all_changed_files }}; do
            echo "::group::Auditing $file"
            python main.py --file "$file" --sarif --lang english 2>&1 || true
            echo "::endgroup::"
          done
          echo "reports_dir=reports" >> $GITHUB_ENV

      - name: Upload SARIF to GitHub Security tab
        if: steps.changed.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports
          category: smart-contract-auditor

      - name: Comment PR with audit summary
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports').filter(f => f.endsWith('.sarif') || f.endsWith('.txt'));
            let summary = `## 🔍 Smart Contract Audit\n\nAudited files: ${reports.length}\n\n`;
            for (const r of reports) {
              summary += `- \`${r}\`\n`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary,
            });