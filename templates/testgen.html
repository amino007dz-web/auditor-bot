<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Generator - Smart Contract Auditor</title>
<style nonce="{{ csp_nonce }}">
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
header { text-align: center; padding: 2rem 0; border-bottom: 1px solid #30363d; margin-bottom: 2rem; }
header h1 { color: #58a6ff; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
.card h2 { color: #58a6ff; margin-bottom: 1rem; }
input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-size: 0.9rem; margin-bottom: 1rem; }
textarea { font-family: monospace; resize: vertical; min-height: 120px; }
.btn { display: inline-block; padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
.btn-primary { background: #238636; color: #fff; }
.btn-primary:hover { background: #2ea043; }
.btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-secondary:hover { background: #30363d; }
pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; font-size: 0.8rem; overflow-x: auto; direction: ltr; text-align: left; }
a { color: #58a6ff; text-decoration: none; }
.flex { display: flex; gap: 0.5rem; align-items: center; }
.meta { color: #8b949e; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Foundry Test Generator</h1>
<p><a href="/">Home</a></p>
</header>

<div class="card">
<h2>Generate Tests</h2>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<textarea name="code" placeholder="Contract code (Solidity)..." required></textarea>
<textarea name="report" placeholder="Audit report (for vulnerability analysis)..." required></textarea>
<input type="text" name="name" placeholder="Contract name (e.g. MyContract)" value="Contract">
<button type="submit" class="btn btn-primary">Generate Tests</button>
</form>
</div>

{% if test_code %}
<div class="card">
<h2>Generated Tests</h2>
<div class="flex"><button class="btn btn-secondary copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('testCode').textContent).catch(function(){alert('Failed to copy')})">Copy</button></div>
<pre id="testCode">{{ test_code }}</pre>
</div>
{% endif %}
</div>
</body>
</html>
