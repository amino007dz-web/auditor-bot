<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Access Codes</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome.min.css') }}">
<style nonce="{{ csp_nonce }}">
:root { --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d; --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #da3633; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
h1 { font-size: 1.3rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
h1 span { color: var(--accent); }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
.card h2 { font-size: 1rem; margin-bottom: 1rem; }
.form-row { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 0.3rem; }
.form-group label { font-size: 0.8rem; color: var(--text2); }
.form-group input, .form-group select { padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 0.85rem; }
.btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.5rem 1rem; border-radius: 6px; border: none; font-size: 0.85rem; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text2); font-weight: 500; }
.active-badge { color: var(--green); } .inactive-badge { color: var(--text2); }
#newCodeDisplay { display: none; margin-top: 1rem; padding: 0.75rem; background: var(--bg3); border-radius: 6px; font-family: monospace; font-size: 1.1rem; text-align: center; border: 1px solid var(--accent); }
#loginSection { max-width: 400px; margin: 3rem auto; }
#adminPanel { display: none; }
</style>
</head>
<body>
<div id="loginSection">
  <div class="card">
    <h2>Login</h2>
    <div class="form-group" style="margin-bottom:0.75rem;">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="Enter admin password">
    </div>
    <button class="btn btn-primary" id="adminLoginBtn">Login</button>
    <div id="loginError" style="color:var(--red);font-size:0.8rem;margin-top:0.5rem;display:none;"></div>
  </div>
</div>

<div id="adminPanel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <h1 style="margin-bottom:0;"><span>🛡️</span> Admin Panel &mdash; Access Codes</h1>
    <button class="btn btn-danger" id="adminLogoutBtn" style="font-size:0.8rem;"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
  <div class="card">
    <h2>Generate New Access Code</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Created For</label>
        <input type="text" id="createdBy" placeholder="Name or email">
      </div>
      <div class="form-group">
        <label>Max Uses</label>
        <input type="number" id="maxUses" value="-1" style="width:100px;">
      </div>
      <button class="btn btn-primary" id="generateCodeBtn"><i class="fas fa-plus"></i> Generate</button>
    </div>
    <div id="newCodeDisplay"></div>
  </div>

  <div class="card">
    <h2>Existing Codes</h2>
    <table>
      <thead><tr><th>Code</th><th>Created For</th><th>Uses</th><th>Max</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
      <tbody id="codesTable"></tbody>
    </table>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
var adminAuthed = false;

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);
document.getElementById('adminPass').addEventListener('keydown', function(e) { if (e.key === 'Enter') adminLogin(); });
document.getElementById('adminLogoutBtn').addEventListener('click', adminLogout);
document.getElementById('generateCodeBtn').addEventListener('click', generateCode);
document.getElementById('codesTable').addEventListener('click', function(e) {
  if (e.target.classList.contains('deactivate-btn')) deactivateCode(e.target.dataset.code);
});

function adminLogin() {
  var pass = document.getElementById('adminPass').value;
  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  }).then(function(r) { if (!r.ok) throw new Error('Server error'); return r.json(); }).then(function(d) {
    if (d.success) { adminAuthed = true; document.getElementById('loginSection').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; loadCodes(); }
    else { document.getElementById('loginError').textContent = d.error || 'Wrong password'; document.getElementById('loginError').style.display = 'block'; }
  }).catch(function(err) {
    document.getElementById('loginError').textContent = 'Error: ' + err.message; document.getElementById('loginError').style.display = 'block';
  });
}

function generateCode() {
  if (!adminAuthed) return;
  var createdBy = document.getElementById('createdBy').value;
  var maxUses = parseInt(document.getElementById('maxUses').value) || -1;
  fetch('/api/admin/codes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ created_by: createdBy, max_uses: maxUses })
  }).then(function(r) { if (!r.ok) throw new Error('Server error'); return r.json(); }).then(function(d) {
    if (d.code) {
      document.getElementById('newCodeDisplay').textContent = 'New Code: ' + d.code;
      document.getElementById('newCodeDisplay').style.display = 'block';
      loadCodes();
    }
  }).catch(function(err) { alert('Error: ' + err.message); });
}

function deactivateCode(code) {
  if (!adminAuthed) return;
  fetch('/api/admin/codes/deactivate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  }).then(function(r) { if (r.ok) loadCodes(); });
}

function loadCodes() {
  fetch('/api/admin/codes').then(function(r) { if (!r.ok) throw new Error('Server error'); return r.json(); }).then(function(data) {
    var tbody = document.getElementById('codesTable');
    tbody.innerHTML = (Array.isArray(data.codes) ? data.codes : []).map(function(c) {
      var status = c.is_active ? '<span class="active-badge">Active</span>' : '<span class="inactive-badge">Inactive</span>';
      var action = c.is_active ? '<button class="btn btn-danger deactivate-btn" data-code="' + esc(c.code) + '" style="padding:0.25rem 0.5rem;font-size:0.75rem;">Deactivate</button>' : '';
      return '<tr><td><code>' + esc(c.code) + '</code></td><td>' + esc(c.created_by || '') + '</td><td>' + c.used_count + '</td><td>' + (c.max_uses === -1 ? 'Unlimited' : c.max_uses) + '</td><td>' + status + '</td><td>' + new Date(c.created_at * 1000).toLocaleDateString() + '</td><td>' + action + '</td></tr>';
    }).join('');
  });
}

function adminLogout() {
  fetch('/api/admin/logout', { method: 'POST' }).then(function() {
    adminAuthed = false;
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('adminPass').value = '';
    document.getElementById('loginError').style.display = 'none';
  });
}

// Check if already authed via session
fetch('/api/admin/check').then(function(r) { return r.json(); }).then(function(d) {
  if (d.authenticated) { adminAuthed = true; document.getElementById('loginSection').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; loadCodes(); }
});
</script>
</body>
</html>
