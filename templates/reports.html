<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Smart Contract Auditor</title>
<style nonce="{{ csp_nonce }}">
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
header { text-align: center; padding: 2rem 0; border-bottom: 1px solid #30363d; margin-bottom: 2rem; }
header h1 { color: #58a6ff; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 2px solid #30363d; color: #58a6ff; }
td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #30363d; }
tr:hover td { background: rgba(88, 166, 255, 0.03); }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
.btn-view { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-view:hover { background: #30363d; }
.empty { text-align: center; padding: 3rem; color: #8b949e; }
.nav-links { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
.nav-links a { color: #58a6ff; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Reports</h1>
<div class="nav-links">
<a href="/">Home</a>
<a href="/report/list">Reports</a>
</div>
</header>

<div class="card">
{% if reports %}
<div class="table-wrap">
<table>
<thead><tr><th>Report Name</th><th>Size</th><th>Modified</th><th></th></tr></thead>
<tbody>
{% for r in reports %}
<tr>
<td><a href="/report/view/{{ r.name }}">{{ r.name }}</a></td>
<td>{{ r.size }}</td>
<td>{{ r.modified }}</td>
<td>
<a href="/report/view/{{ r.name }}" class="btn btn-view">View</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% else %}
<div class="empty">
<p>No reports yet.</p>
<p style="margin-top: 0.5rem;"><a href="/">Upload a smart contract to start analysis.</a></p>
</div>
{% endif %}
</div>
</div>
</body>
</html>
