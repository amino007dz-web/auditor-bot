<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير - Smart Contract Auditor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
header { text-align: center; padding: 2rem 0; border-bottom: 1px solid #30363d; margin-bottom: 2rem; }
header h1 { color: #58a6ff; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
table { width: 100%; border-collapse: collapse; }
th { text-align: right; padding: 0.75rem 0.5rem; border-bottom: 2px solid #30363d; color: #58a6ff; }
td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #30363d; }
tr:hover td { background: rgba(88, 166, 255, 0.03); }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
.btn-view { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-view:hover { background: #30363d; }
.btn-del { background: #da3633; color: #fff; border: none; cursor: pointer; }
.btn-del:hover { background: #f85149; }
.empty { text-align: center; padding: 3rem; color: #8b949e; }
.nav-links { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
.nav-links a { color: #58a6ff; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>التقارير</h1>
<div class="nav-links">
<a href="/">الرئيسية</a>
<a href="/report/list">التقارير</a>
</div>
</header>

<div class="card">
{% if reports %}
<table>
<thead><tr><th>اسم التقرير</th><th>الحجم</th><th>تاريخ التعديل</th><th></th></tr></thead>
<tbody>
{% for r in reports %}
<tr>
<td><a href="/report/view/{{ r.name }}">{{ r.name }}</a></td>
<td>{{ r.size }}</td>
<td>{{ r.modified }}</td>
<td>
<a href="/report/view/{{ r.name }}" class="btn btn-view">عرض</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
{% else %}
<div class="empty">
<p>لا توجد تقارير بعد</p>
<p style="margin-top: 0.5rem;"><a href="/">ارفع عقداً ذكياً لبدء التحليل</a></p>
</div>
{% endif %}
</div>
</div>
</body>
</html>
