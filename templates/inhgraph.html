<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inheritance Graph - Smart Contract Auditor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0d1117; color:#c9d1d9; padding:2rem; max-width:1000px; margin:0 auto; }
h1 { color:#58a6ff; }
a { color:#58a6ff; }
.card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1.5rem; margin:1rem 0; }
textarea { width:100%; padding:0.75rem; border:1px solid #30363d; border-radius:6px; background:#0d1117; color:#c9d1d9; margin-bottom:1rem; font-family:monospace; min-height:200px; }
.btn { padding:0.75rem 1.5rem; border:none; border-radius:6px; cursor:pointer; background:#238636; color:#fff; }
.graph-frame { width:100%; height:600px; border:none; border-radius:6px; }
</style></head>
<body>
<h1>🔗 Inheritance Graph</h1>
<p><a href="/">الرئيسية</a></p>
<div class="card">
<form method="POST">
<textarea name="code" placeholder="الصق كود Solidity هنا..." required></textarea>
<button type="submit" class="btn">رسم الوراثة</button>
</form>
</div>
{% if graph %}
<div class="card">
<iframe class="graph-frame" srcdoc="{{ graph|e }}"></iframe>
<p><a href="/download/inheritance_{{ '%s'|format(range(1,999999)|random) }}.html" target="_blank">فتح في نافذة جديدة</a></p>
</div>
{% endif %}
</body></html>
