<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Audit — VulnAudit</title>
<style nonce="{{ csp_nonce }}">
:root { --bg-primary:#0d1117; --bg-secondary:#161b22; --bg-card:#21262d; --border:#30363d; --text-primary:#e6edf3; --text-secondary:#8b949e; --accent:#58a6ff; --radius:10px; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Segoe UI',sans-serif; background:var(--bg-primary); color:var(--text-primary); padding:1.5rem; max-width:1000px; margin:0 auto; }
h1 { font-size:1.5rem; color: var(--accent); }
.nav { display:flex; gap:0.5rem; flex-wrap:wrap; margin:0.75rem 0; }
.nav a { color:var(--text-secondary); text-decoration:none; padding:0.4rem 0.85rem; border-radius:6px; font-size:0.85rem; border:1px solid transparent; }
.nav a:hover { color:var(--text-primary); background:var(--bg-card); border-color:var(--border); }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; margin:1rem 0; }
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:1rem; }
.tab { padding:0.6rem 1.2rem; cursor:pointer; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; font-size:0.85rem; color:var(--text-secondary); background:transparent; }
.tab:hover { color:var(--text-primary); background:var(--bg-primary); }
.tab.active { color:var(--accent); border-color:var(--border); background:var(--bg-card); margin-bottom:-1px; }
.tab-content { display:none; }
.tab-content.active { display:block; }
input, select { width:100%; padding:0.7rem; border:1px solid var(--border); border-radius:6px; background:var(--bg-primary); color:var(--text-primary); font-size:0.9rem; }
input:focus, select:focus { outline:none; border-color:var(--accent); }
.btn { display:inline-block; padding:0.7rem 1.4rem; border:none; border-radius:6px; font-size:0.9rem; cursor:pointer; background:#238636; color:#fff; transition:filter 0.2s; }
.btn:hover { filter:brightness(1.15); }
.btn:disabled { opacity:0.5; cursor:not-allowed; filter:none; }
.mt-1 { margin-top:1rem; }
pre { background:var(--bg-primary); border:1px solid var(--border); border-radius:6px; padding:1rem; max-height:600px; overflow:auto; direction:ltr; text-align:left; font-size:0.82rem; line-height:1.6; }
.hidden { display:none !important; }
#loading { text-align:center; padding:2rem; }
.spinner { width:36px; height:36px; border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; animation:spin 0.9s infinite; margin:0 auto 1rem; }
@keyframes spin { to { transform:rotate(360deg); } }
.upload-zone { border:2px dashed var(--border); border-radius:var(--radius); padding:2rem; text-align:center; cursor:pointer; transition:all 0.25s; }
.upload-zone:hover, .upload-zone.dragover { border-color:var(--accent); background:rgba(88,166,255,0.05); }
.upload-zone .icon { font-size:2.5rem; }
.upload-zone p { color:var(--text-secondary); }
.file-name { color:var(--accent); margin-top:0.5rem; font-size:0.85rem; }
.success { color:#3fb950; }
.error { color:#f85149; }
footer { text-align:center; padding:1.5rem; color:var(--text-secondary); border-top:1px solid var(--border); margin-top:2rem; font-size:0.8rem; }
</style></head>
<body>
<h1>Project Security Audit</h1>
<nav class="nav"><a href="/">Home</a><a href="/batch">Batch</a><a href="/dashboard">Dashboard</a></nav>

<div class="card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('path',this)">Server Path</div>
    <div class="tab" onclick="switchTab('zip',this)">Upload ZIP</div>
  </div>

  <div id="tab-path" class="tab-content active">
    <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="path" placeholder="Full path to project on server..." required>
      <p style="color:var(--text-secondary);font-size:0.8rem;margin-bottom:0.5rem;">Auto-detects Foundry / Hardhat / Truffle / Brownie</p>
      <button type="submit" class="btn">Analyze Project</button>
    </form>
  </div>

  <div id="tab-zip" class="tab-content">
    <form id="zipForm">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="upload-zone" id="dropZone">
      <div class="icon">📦</div>
      <p>Upload a ZIP file of your project</p>
      <input type="file" id="fileInput" name="zipfile" accept=".zip" style="display:none" onchange="handleFile(event)">
    </div>
    <div id="fileInfo" class="hidden file-name"></div>
    <div style="position:relative; display:inline-block;">
      <button type="submit" class="btn mt-1" id="uploadBtn">Upload &amp; Analyze</button>
    </div>
    </form>
  </div>
</div>

<div id="loading" class="hidden card">
  <div class="spinner"></div>
  <p>Extracting and analyzing project...</p>
</div>

<div id="result" class="hidden card"><pre id="resultContent"></pre></div>

<footer>VulnAudit &mdash; Smart Contract Security Analysis Engine</footer>

<script nonce="{{ csp_nonce }}">
let uploadedFile = null;
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}
function handleFile(e) {
  uploadedFile = e.target.files[0];
  if (uploadedFile) {
    document.getElementById('fileInfo').textContent = uploadedFile.name + ' (' + (uploadedFile.size/1024).toFixed(1) + ' KB)';
    document.getElementById('fileInfo').classList.remove('hidden');
  }
}
document.getElementById('dropZone').addEventListener('click', function() { document.getElementById('fileInput').click(); });
document.getElementById('dropZone').addEventListener('dragover', function(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); });
document.getElementById('dropZone').addEventListener('dragleave', function(e) { e.currentTarget.classList.remove('dragover'); });
document.getElementById('dropZone').addEventListener('drop', function(e) {
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  var files = e.dataTransfer.files;
  if (files.length > 0) {
    uploadedFile = files[0];
    document.getElementById('fileInput').files = files;
    document.getElementById('fileInfo').textContent = uploadedFile.name + ' (' + (uploadedFile.size/1024).toFixed(1) + ' KB)';
    document.getElementById('fileInfo').classList.remove('hidden');
  }
});
document.getElementById('zipForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  if (!uploadedFile) { alert('Please select a ZIP file first'); return; }
  var loading = document.getElementById('loading');
  loading.classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('uploadBtn').disabled = true;
  var formData = new FormData();
  formData.append('zipfile', uploadedFile);
  formData.append('csrf_token', document.querySelector('#zipForm [name=csrf_token]').value);
  try {
    var resp = await fetch('/project', { method:'POST', body:formData });
    if (!resp.ok) throw new Error('Server error: ' + resp.status);
    var data = await resp.json();
    loading.classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    var pre = document.getElementById('resultContent');
    pre.textContent = data.report || data.error || JSON.stringify(data, null, 2);
  } catch (err) {
    loading.classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('resultContent').textContent = 'Error: ' + err.message;
  } finally {
    document.getElementById('uploadBtn').disabled = false;
  }
});
</script>
</body>
</html>
