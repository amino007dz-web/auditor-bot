<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rules - Smart Contract Auditor</title>
<style nonce="{{ csp_nonce }}">
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
header { text-align: center; padding: 2rem 0; border-bottom: 1px solid #30363d; margin-bottom: 2rem; }
header h1 { color: #58a6ff; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
.card h2 { color: #58a6ff; margin-bottom: 1rem; }
input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-size: 0.9rem; margin-bottom: 1rem; }
textarea { font-family: monospace; resize: vertical; }
.btn { display: inline-block; padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin: 0.25rem; }
.btn-green { background: #238636; color: #fff; }
.btn-green:hover { background: #2ea043; }
.btn-gray { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-gray:hover { background: #30363d; }
.btn-red { background: #da3633; color: #fff; }
.btn-red:hover { background: #f85149; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 2px solid #30363d; color: #58a6ff; }
td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #30363d; vertical-align: top; }
tr:hover td { background: rgba(88, 166, 255, 0.03); }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.meta { color: #8b949e; font-size: 0.85rem; }
.flex { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Detection Rules</h1>
<p><a href="/">Home</a></p>
</header>

<div class="card">
<h2>Add New Rule</h2>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="text" name="name" placeholder="Rule name" required>
<input type="text" name="pattern" placeholder="Pattern (Regex)" required>
<select name="severity">
<option value="Critical">Critical</option>
<option value="High" selected>High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>
<option value="Info">Info</option>
</select>
<select name="lang">
<option value="solidity">Solidity</option>
<option value="vyper">Vyper</option>
<option value="move">Move</option>
<option value="all">All</option>
</select>
<textarea name="description" placeholder="Description of the vulnerability this rule detects"></textarea>
<button type="submit" class="btn btn-green">Add Rule</button>
</form>
</div>

<div class="card">
<h2>Existing Rules ({{ rules|length }})</h2>
{% if rules %}
<div class="table-wrap">
<table>
<tr><th>Name</th><th>Severity</th><th>Lang</th><th>Description</th><th></th></tr>
{% for r in rules %}
<tr>
<td>{{ r.name }}</td><td>{{ r.severity }}</td><td>{{ r.lang }}</td><td>{{ r.description }}</td>
<td>
<form method="POST" action="/rules/delete/{{ r.id }}" style="display:inline;">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" class="btn btn-red">Delete</button>
</form>
</td>
</tr>
{% endfor %}
</table>
</div>
{% else %}
<p class="meta">No rules defined yet.</p>
{% endif %}
</div>

<div class="card">
<h2>Test Rules Against Code</h2>
<form method="POST" action="/rules/test">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<textarea name="code" placeholder="Paste code to test rules against..." style="min-height:150px;"></textarea>
<button type="submit" class="btn btn-gray">Scan</button>
</form>
</div>
</div>
</body>
</html>
