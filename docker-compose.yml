version: "3.9"

services:
  auditor:
    build: .
    container_name: sc-auditor
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./reports:/app/reports
      - ./instance:/app/instance
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - PORT=5000
    command: python main.py

  web-ui:
    build: .
    container_name: sc-auditor-web
    ports:
      - "8080:5000"
    volumes:
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
      - ./instance:/app/instance
    env_file:
      - .env
    command: python web_ui.py
    profiles:
      - web

  api:
    build: .
    container_name: sc-auditor-api
    ports:
      - "5001:5001"
    volumes:
      - ./reports:/app/reports
      - ./.env:/app/.env:ro
      - ./instance:/app/instance
    env_file:
      - .env
    command: python api_mode.py
    profiles:
      - api
